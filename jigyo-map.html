<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>事業候補マップ</title>
<style>
  :root{
    --paper:#F6F3FC; --paper-2:#FFFFFF; --ink:#1E1B2E; --ink-soft:#6F6A85;
    --rule:#E7E2F4; --mute:#C9C5D6;
    --ai:#6C4DF6; --shu:#FF4D6D; --moegi:#FFB020; --mint:#12C2A0;
    --grad:linear-gradient(135deg,#7C5CFF 0%,#B45CFF 50%,#FF5C9E 100%);
    --shadow-s:0 2px 8px rgba(43,27,90,.07);
    --shadow-m:0 8px 24px rgba(43,27,90,.10);
    --shadow-l:0 18px 48px rgba(43,27,90,.16);
    --r:16px;
    --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
    --gothic:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overscroll-behavior:none}
  body{
    background:
      radial-gradient(900px 480px at 8% -8%, #EFE6FF 0%, rgba(239,230,255,0) 62%),
      radial-gradient(760px 420px at 104% 4%, #FFE7F0 0%, rgba(255,231,240,0) 60%),
      var(--paper);
    background-attachment:fixed;
    color:var(--ink);font-family:var(--gothic);font-size:15px;line-height:1.6;
    -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;
  }
  #app{max-width:860px;margin:0 auto;padding:22px 16px 170px}
  body.fs #app > *:not(#stagewrap){display:none}
  body.fs #app{max-width:none;padding:0}
  button{font-family:inherit}
  @media (prefers-reduced-motion:no-preference){
    button{transition:transform .12s ease, background .18s ease, box-shadow .18s ease, color .18s ease, border-color .18s ease}
    button:active{transform:scale(.96)}
  }

  /* ---- header ---- */
  .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;
    letter-spacing:.1em;color:#7A5BF0;background:#EDE8FF;padding:5px 11px;border-radius:999px}
  .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--grad)}
  h1{font-size:31px;font-weight:700;line-height:1.2;margin:12px 0 6px;letter-spacing:-.02em;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;width:max-content;max-width:100%}
  .lede{color:var(--ink-soft);font-size:13px;margin:0 0 18px}
  .savestate{font-size:11px;color:#9A93AE;font-weight:500}

  /* ---- segmented tabs ---- */
  .views{display:flex;gap:4px;background:#EFEAFA;padding:4px;border-radius:999px;margin-bottom:14px}
  .views button{flex:1;appearance:none;background:none;border:0;padding:10px 4px;cursor:pointer;
    color:var(--ink-soft);font-size:14px;font-weight:600;border-radius:999px;letter-spacing:.02em}
  .views button[aria-selected="true"]{background:var(--paper-2);color:var(--ink);box-shadow:var(--shadow-s)}

  /* ---- tally chips ---- */
  .tally{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .tally span{flex:0 0 auto;display:inline-flex;align-items:baseline;gap:6px;background:var(--paper-2);
    border-radius:999px;padding:7px 14px;font-size:11.5px;color:var(--ink-soft);box-shadow:var(--shadow-s)}
  .tally b{font-size:16px;font-weight:700;color:var(--ink)}

  /* ---- stage ---- */
  #stage{position:relative;border-radius:22px;overflow:hidden;background:
    radial-gradient(circle at 1px 1px, rgba(124,92,255,.16) 1.2px, transparent 1.2px) 0 0/24px 24px,
    linear-gradient(160deg,#FFFFFF 0%,#FBF8FF 55%,#FFF6FA 100%);
    box-shadow:var(--shadow-m)}
  #svg{display:block;width:100%;height:clamp(430px,64vh,660px);touch-action:none;cursor:grab}
  #svg.grabbing{cursor:grabbing}
  #stage.fs{position:fixed;inset:0;z-index:90;border-radius:0}
  #stage.fs #svg{height:100vh;height:100dvh}
  .mapbtns{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;z-index:5}
  .mapbtns button{width:40px;height:40px;border:0;border-radius:14px;background:rgba(255,255,255,.92);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    color:var(--ink);font-size:15px;cursor:pointer;padding:0;line-height:1;box-shadow:var(--shadow-s)}
  .mapbtns button:hover{background:#fff;box-shadow:var(--shadow-m);color:var(--ai)}
  .hint{position:absolute;left:12px;bottom:12px;font-size:11px;color:var(--ink-soft);
    background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    padding:6px 12px;border-radius:999px;pointer-events:none;box-shadow:var(--shadow-s)}
  #inline{position:absolute;display:none;z-index:20;border:2px solid var(--ai);background:#fff;
    font-family:var(--gothic);font-size:14px;font-weight:600;padding:9px 10px;text-align:center;
    border-radius:12px;color:var(--ink);box-shadow:0 0 0 5px rgba(108,77,246,.16),var(--shadow-m);outline:none}

  /* ---- floating node bar ---- */
  #nodebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:100;width:min(560px,calc(100% - 24px));background:rgba(255,255,255,.94);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border-radius:22px;box-shadow:var(--shadow-l);display:none;padding:12px}
  #nodebar.on{display:block}
  @media (prefers-reduced-motion:no-preference){#nodebar.on{animation:rise .2s cubic-bezier(.2,.9,.3,1.2)}}
  @keyframes rise{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
  #nb-name{font-size:14px;font-weight:700;padding:0 4px 9px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  #nb-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #nb-close{appearance:none;background:#F2EEFB;border:0;color:var(--ink-soft);width:26px;height:26px;
    border-radius:50%;font-size:15px;cursor:pointer;padding:0;flex:0 0 26px;line-height:1}
  .nbrow{display:flex;gap:6px;margin-top:6px}
  .nbrow button{flex:1;appearance:none;background:#F5F1FE;border:0;border-radius:13px;
    color:var(--ink);padding:11px 4px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
  .nbrow button:hover{background:#EDE6FE;color:var(--ai)}
  #nb-add{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(124,92,255,.34)}
  #nb-add:hover{color:#fff}
  .nbrow button.danger{flex:0 0 62px;background:#FFEDF1;color:#E03256}
  .nbrow button.danger:hover{background:#FFDFE6;color:#C8203F}

  /* ---- cards ---- */
  .weights{background:var(--paper-2);border-radius:var(--r);padding:16px;margin-bottom:16px;box-shadow:var(--shadow-s)}
  .weights h3{margin:0 0 2px;font-size:14px;font-weight:700}
  .weights p{margin:0 0 12px;font-size:11.5px;color:var(--ink-soft)}
  .wrow{display:flex;align-items:center;gap:12px;margin:8px 0}
  .wrow label{flex:0 0 100px;font-size:12.5px;font-weight:500}
  .wrow input{flex:1;accent-color:var(--ai)}
  .wrow .v{font-family:var(--mono);font-size:11px;width:32px;text-align:right;color:var(--ai);font-weight:600}

  ol.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  ol.rank li{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;
    padding:13px 15px;background:var(--paper-2);border-radius:14px;cursor:pointer;box-shadow:var(--shadow-s)}
  ol.rank li:hover{box-shadow:var(--shadow-m)}
  ol.rank li .idx{font-family:var(--mono);font-size:12px;color:#B4ADC6;font-weight:600}
  ol.rank li .nm{font-size:14.5px;font-weight:600}
  ol.rank li .dm{font-size:11px;color:var(--ink-soft)}
  .bar{height:6px;background:#F0ECF9;border-radius:999px;margin-top:7px;position:relative;overflow:hidden}
  .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--grad)}
  ol.rank li.adopt .bar i{background:linear-gradient(90deg,#FF7A5C,#FF4D6D)}
  .pts{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .empty{background:var(--paper-2);border-radius:var(--r);padding:30px 20px;text-align:center;
    color:var(--ink-soft);font-size:13px;box-shadow:var(--shadow-s)}
  .empty b{display:block;font-size:16px;font-weight:700;color:var(--ink);margin-bottom:6px}
  .mx{width:100%;height:auto;display:block;background:var(--paper-2);border-radius:var(--r);box-shadow:var(--shadow-s)}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--ink-soft);margin-top:12px}
  .legend span{background:var(--paper-2);padding:5px 12px;border-radius:999px;box-shadow:var(--shadow-s)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

  /* ---- sheets ---- */
  .scrim{position:fixed;inset:0;background:rgba(30,27,46,.42);-webkit-backdrop-filter:blur(3px);
    backdrop-filter:blur(3px);z-index:110;display:none}
  .scrim.on{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:120;background:var(--paper-2);
    border-radius:26px 26px 0 0;max-height:88vh;overflow:auto;padding:10px 18px 30px;
    transform:translateY(101%);transition:transform .28s cubic-bezier(.2,.9,.3,1.05);box-shadow:var(--shadow-l)}
  .sheet::before{content:"";display:block;width:38px;height:4px;border-radius:999px;background:#DFD8F0;margin:0 auto 14px}
  .sheet.on{transform:translateY(0)}
  @media (prefers-reduced-motion:reduce){.sheet{transition:none}}
  @media(min-width:780px){.sheet{left:50%;transform:translate(-50%,101%);width:720px;border-radius:26px 26px 0 0}
    .sheet.on{transform:translate(-50%,0)}}
  .sheet h2{font-size:18px;font-weight:700;margin:0 0 14px;letter-spacing:-.01em}
  .f{margin-bottom:16px}
  .f > label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:7px;font-weight:600;letter-spacing:.03em}
  .f textarea{width:100%;padding:12px 13px;border:1.5px solid var(--rule);background:#FBFAFE;
    font-family:var(--gothic);font-size:15px;color:var(--ink);border-radius:13px;min-height:64px;resize:vertical}
  .f textarea:focus{border-color:var(--ai);outline:none;background:#fff}
  .arow{display:flex;align-items:center;gap:12px;margin:11px 0}
  .arow label{flex:0 0 108px;font-size:12.5px;line-height:1.3;font-weight:500}
  .arow label small{display:block;font-size:10px;color:var(--ink-soft);font-weight:400}
  .arow input[type=range]{flex:1;accent-color:var(--ai)}
  .arow .v{font-family:var(--mono);font-size:13px;width:26px;text-align:right;color:var(--ai);font-weight:700}
  .sheet-actions{display:flex;gap:8px;margin-top:20px}
  .btn-primary{flex:1;background:var(--grad);color:#fff;border:0;padding:15px;font-size:14.5px;font-weight:700;
    cursor:pointer;border-radius:15px;box-shadow:0 6px 18px rgba(124,92,255,.32)}
  .btn-ghost{background:#F5F1FE;border:0;color:var(--ink-soft);padding:15px 16px;cursor:pointer;
    border-radius:15px;font-size:13.5px;font-weight:600}
  .btn-ghost:hover{background:#EDE6FE;color:var(--ai)}

  /* ---- pickers ---- */
  .shapes,.fonts{display:flex;gap:7px;flex-wrap:wrap}
  .shapes button,.fonts button{flex:1 1 0;min-width:60px;appearance:none;background:#F7F4FE;border:2px solid transparent;
    border-radius:13px;cursor:pointer;padding:10px 4px;font-size:13.5px;color:var(--ink);line-height:1.2}
  .shapes button[aria-pressed="true"],.fonts button[aria-pressed="true"]{
    border-color:var(--ai);background:#fff;box-shadow:0 0 0 4px rgba(108,77,246,.13)}
  .shapes svg{display:block;margin:0 auto}
  .fonts button.wt{flex:0 0 58px;font-weight:700;font-size:13px}
  .sw{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .sw button{width:34px;height:34px;border:1.5px solid rgba(30,27,46,.10);border-radius:11px;cursor:pointer;padding:0}
  .sw button[aria-pressed="true"]{border-color:var(--ai);box-shadow:0 0 0 4px rgba(108,77,246,.16)}
  .sw button.auto{font-size:11px;font-weight:600;background:#F7F4FE;color:var(--ink-soft);width:auto;padding:0 12px}
  .sw input[type=color]{width:38px;height:34px;padding:0;border:1.5px solid var(--rule);border-radius:11px;background:none;cursor:pointer}

  .docbar{display:flex;gap:8px;margin:0 0 14px}
  #doc-open{flex:1;display:flex;align-items:center;gap:9px;background:var(--paper-2);border:0;border-radius:14px;
    padding:12px 15px;cursor:pointer;box-shadow:var(--shadow-s);color:var(--ink);font-size:14px;font-weight:600;text-align:left}
  #doc-open::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--grad);flex:0 0 9px}
  #doc-open span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #doc-open em{font-style:normal;font-size:11px;color:var(--ink-soft);font-weight:500}
  .doc{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 14px;
    background:#F7F4FE;border-radius:14px;margin-bottom:8px;cursor:pointer;border:2px solid transparent}
  .doc.cur{border-color:var(--ai);background:#fff;box-shadow:var(--shadow-s)}
  .doc .dn{font-size:14px;font-weight:600}
  .doc .dd{font-size:11px;color:var(--ink-soft)}
  .doc .acts{display:flex;gap:5px}
  .doc .acts button{background:#fff;border:0;border-radius:10px;padding:8px 10px;font-size:11px;
    font-weight:600;cursor:pointer;color:var(--ink-soft)}
  .doc .acts button:hover{color:var(--ai)}
  .doc .acts button.x:hover{color:#E03256}
  body.dark .doc{background:#2C2540}
  body.dark .doc.cur{background:#1D1830}
  body.dark .doc .acts button{background:#3A3255;color:var(--ink)}
  /* ---- tools + toast ---- */
  .tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
  .tools button{flex:1 1 44%;appearance:none;background:var(--paper-2);border:0;border-radius:14px;
    color:var(--ink-soft);padding:13px;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:var(--shadow-s)}
  .tools button:hover{color:var(--ai);box-shadow:var(--shadow-m)}
  #ex-print{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(124,92,255,.28)}
  #ex-print:hover{color:#fff}
  .toast{position:fixed;bottom:132px;left:50%;transform:translateX(-50%);background:rgba(30,27,46,.94);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;
    padding:11px 20px;font-size:13px;font-weight:600;border-radius:999px;z-index:130;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:var(--shadow-l)}
  .toast.on{opacity:1}

  #printarea{display:none}
  #printarea svg{display:block;margin:0 auto}
  @media print{
    @page{margin:8mm}
    html,body{background:#fff}
    #app,#nodebar,.scrim,.sheet,.toast{display:none !important}
    #printarea{display:block !important}
  }

  /* ================= dark mode ================= */
  body.dark{
    --paper:#16121F; --paper-2:#241F33; --ink:#F2EFFA; --ink-soft:#A9A2C0;
    --rule:#3A3350; --mute:#5B5474;
    --ai:#9B7BFF; --shu:#FF6B85; --moegi:#FFC44D; --mint:#3BE0BE;
    --grad:linear-gradient(135deg,#8B6BFF 0%,#C46BFF 50%,#FF6BA8 100%);
    --shadow-s:0 2px 10px rgba(0,0,0,.40);
    --shadow-m:0 10px 28px rgba(0,0,0,.50);
    --shadow-l:0 20px 54px rgba(0,0,0,.62);
    background:
      radial-gradient(900px 480px at 8% -8%, #2B1E52 0%, rgba(43,30,82,0) 62%),
      radial-gradient(760px 420px at 104% 4%, #3E1B36 0%, rgba(62,27,54,0) 60%),
      var(--paper);
  }
  body.dark .eyebrow{background:rgba(155,123,255,.18);color:#C6B4FF}
  body.dark .views{background:#221C33}
  body.dark #stage{background:
    radial-gradient(circle at 1px 1px, rgba(155,123,255,.20) 1.2px, transparent 1.2px) 0 0/24px 24px,
    linear-gradient(160deg,#221C33 0%,#1D1830 55%,#2A1B2E 100%)}
  body.dark .mapbtns button{background:rgba(36,31,51,.92);color:var(--ink)}
  body.dark .mapbtns button:hover{background:#2E2743;color:var(--ai)}
  body.dark .hint{background:rgba(36,31,51,.9);color:var(--ink-soft)}
  body.dark #inline{background:#2A2340;border-color:var(--ai);color:var(--ink);
    box-shadow:0 0 0 5px rgba(155,123,255,.22),var(--shadow-m)}
  body.dark #nodebar{background:rgba(36,31,51,.95)}
  body.dark #nb-close{background:#332B49;color:var(--ink-soft)}
  body.dark .nbrow button{background:#322A47;color:var(--ink)}
  body.dark .nbrow button:hover{background:#3C3357;color:#C6B4FF}
  body.dark .nbrow button.danger{background:rgba(255,107,133,.16);color:#FF9AAC}
  body.dark .nbrow button.danger:hover{background:rgba(255,107,133,.26);color:#FFB6C3}
  body.dark .sheet::before{background:#3E3658}
  body.dark .f textarea{background:#1D1830;border-color:var(--rule);color:var(--ink)}
  body.dark .f textarea:focus{background:#221C36}
  body.dark .btn-ghost{background:#322A47;color:var(--ink-soft)}
  body.dark .btn-ghost:hover{background:#3C3357;color:#C6B4FF}
  body.dark .shapes button,body.dark .fonts button{background:#2C2540;color:var(--ink)}
  body.dark .shapes button[aria-pressed="true"],body.dark .fonts button[aria-pressed="true"]{
    background:#1D1830;box-shadow:0 0 0 4px rgba(155,123,255,.20)}
  body.dark .sw button{border-color:rgba(255,255,255,.16)}
  body.dark .sw button.auto{background:#2C2540;color:var(--ink-soft)}
  body.dark .sw input[type=color]{border-color:var(--rule)}
  body.dark .bar{background:#2C2540}
  body.dark ol.rank li .idx{color:#6E6690}
  body.dark .tools button{background:var(--paper-2);color:var(--ink-soft)}
  body.dark .tools button:hover{color:#C6B4FF}
  body.dark .toast{background:rgba(58,50,84,.96)}
  :focus-visible{outline:2px solid var(--ai);outline-offset:3px}
  [hidden]{display:none !important}
</style>

<div id="app">
  <div class="eyebrow">事業候補マップ</div>
  <h1>広げてから、絞る</h1>
  <p class="lede">マップ上で候補を出し、5軸で採点し、順位と配置で決める。<span class="savestate" id="save">—</span></p>

  <div class="docbar">
    <button id="doc-open"><span id="docname">…</span><em>切り替え ▾</em></button>
  </div>

  <div class="views" role="tablist">
    <button role="tab" data-view="map" aria-selected="true">地図</button>
    <button role="tab" data-view="rank" aria-selected="false">順位</button>
    <button role="tab" data-view="mx" aria-selected="false">配置</button>
  </div>

  <div class="tally">
    <span><b id="t-total">0</b> 候補</span>
    <span><b id="t-rated">0</b> 評価済</span>
    <span><b id="t-adopt">0</b> 注力</span>
    <span><b id="t-drop">0</b> 見送り</span>
  </div>

  <div id="stagewrap">
    <section id="view-map">
      <div id="stage">
        <svg id="svg"></svg>
        <div class="mapbtns">
          <button id="z-fs" title="全画面">⛶</button>
          <button id="z-in" title="拡大">＋</button>
          <button id="z-out" title="縮小">−</button>
          <button id="z-fit" title="全体表示">⤢</button>
          <button id="z-tidy" title="整列しなおす">◇</button>
          <button id="z-print" title="印刷">⎙</button>
          <button id="z-dark" title="ダークモード">☾</button>
        </div>
        <div class="hint" id="hint">タップで選択　ドラッグで移動　ダブルタップで改名</div>
        <input id="inline" type="text" autocomplete="off">
      </div>
    </section>
  </div>

  <section id="view-rank" hidden>
    <div class="weights">
      <h3>重みづけ</h3>
      <p>何を重く見るかで順位は変わる。ここを動かして納得のいく並びを探す。</p>
      <div id="wlist"></div>
    </div>
    <div id="ranklist"></div>
  </section>

  <section id="view-mx" hidden>
    <div id="mxwrap"></div>
    <div class="legend">
      <span><i style="background:var(--shu)"></i>注力</span>
      <span><i style="background:var(--ai)"></i>検討中</span>
      <span><i style="background:var(--moegi)"></i>保留</span>
      <span><i style="background:var(--mute)"></i>見送り</span>
    </div>
  </section>

  <div class="tools">
    <button id="ex-print">印刷 / PDF</button>
    <button id="ex-png">画像で保存（PNG）</button>
    <button id="ex-md">Markdownで書き出す</button>
    <button id="ex-json">バックアップ(JSON)</button>
  </div>
</div>

<div id="printarea"></div>

<div id="nodebar">
  <div id="nb-name"><span id="nb-label"></span><button id="nb-close" aria-label="選択を解除">×</button></div>
  <div class="nbrow">
    <button id="nb-add">＋ 子を足す</button>
    <button id="nb-rename">✎ 名前</button>
    <button id="nb-score">◎ 採点</button>
  </div>
  <div class="nbrow">
    <button id="nb-style">◈ 見た目</button>
    <button id="nb-status">検討中</button>
    <button id="nb-del" class="danger">削除</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="候補を採点">
  <h2 id="sh-title">候補を採点</h2>
  <div class="f"><label for="f-note">メモ（前提・懸念・次の一手）</label><textarea id="f-note"></textarea></div>
  <div id="axes"></div>
  <div class="sheet-actions">
    <button class="btn-primary" id="f-save">保存する</button>
    <button class="btn-ghost" id="f-clear">未評価に戻す</button>
  </div>
</div>

<div class="sheet" id="stylesheet" role="dialog" aria-modal="true" aria-label="見た目を変える">
  <h2 id="sy-title">見た目を変える</h2>
  <div class="f"><label>形</label><div class="shapes" id="sy-shapes"></div></div>
  <div class="f"><label>書体</label><div class="fonts" id="sy-fonts"></div></div>
  <div class="f"><label>背景色</label><div class="sw" id="sy-bg"></div></div>
  <div class="f"><label>枠線の色</label><div class="sw" id="sy-border"></div></div>
  <div class="f"><label>文字色</label><div class="sw" id="sy-color"></div></div>
  <div class="f"><label>大きさ（枠の右下をドラッグしても変えられます）</label>
    <div class="arow"><label for="sy-w">幅</label><input type="range" id="sy-w" min="56" max="360" step="2"><span class="v" id="sy-wv"></span></div>
    <div class="arow"><label for="sy-h">高さ</label><input type="range" id="sy-h" min="30" max="240" step="2"><span class="v" id="sy-hv"></span></div>
    <div class="arow"><label for="sy-fs">文字サイズ</label><input type="range" id="sy-fs" min="9" max="24" step="1"><span class="v" id="sy-fsv"></span></div>
  </div>
  <div id="sy-line">
    <div class="f" style="border-top:1px solid var(--rule);padding-top:12px"><label>つなぎ線の形</label><div class="shapes" id="sy-kinds"></div></div>
    <div class="f"><label>線の色</label><div class="sw" id="sy-lc"></div></div>
    <div class="f"><label>線の種類</label><div class="fonts" id="sy-ld"></div></div>
    <div class="f"><div class="arow"><label for="sy-lw">線の太さ</label><input type="range" id="sy-lw" min="0.5" max="8" step="0.5"><span class="v" id="sy-lwv"></span></div></div>
  </div>
  <div class="sheet-actions">
    <button class="btn-primary" id="sy-done">閉じる</button>
    <button class="btn-ghost" id="sy-branch">枝全体に適用</button>
    <button class="btn-ghost" id="sy-reset">既定に戻す</button>
  </div>
</div>

<div class="sheet" id="printsheet" role="dialog" aria-modal="true" aria-label="印刷">
  <h2>印刷</h2>
  <div class="f"><label>用紙の向き</label>
    <div class="fonts" id="pr-orient">
      <button data-o="landscape" style="font-size:13px">横（A4）</button>
      <button data-o="portrait" style="font-size:13px">縦（A4）</button>
    </div>
  </div>
  <p style="font-size:11.5px;color:var(--ink-soft);margin:0 0 4px">マップ全体が1枚に収まるように自動で縮小されます。画面の拡大率や表示位置は影響しません。</p>
  <div class="sheet-actions">
    <button class="btn-primary" id="pr-go">印刷する</button>
    <button class="btn-ghost" id="pr-png">PNG</button>
    <button class="btn-ghost" id="pr-close">閉じる</button>
  </div>
</div>

<div class="sheet" id="docsheet" role="dialog" aria-modal="true" aria-label="保存したマップ">
  <h2>保存したマップ</h2>
  <div id="doclist"></div>
  <p style="font-size:11.5px;color:var(--ink-soft);margin:10px 0 0">編集は自動で保存されます。次に開いたときは最後に使ったマップが続きから開きます。</p>
  <div class="sheet-actions">
    <button class="btn-primary" id="dc-new">＋ 新規作成</button>
    <button class="btn-ghost" id="dc-tpl">見本から</button>
    <button class="btn-ghost" id="dc-import">読み込む</button>
    <button class="btn-ghost" id="dc-close">閉じる</button>
  </div>
  <input type="file" id="dc-file" accept="application/json,.json" hidden>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var AXES=[
    {k:"synergy", n:"自社資産の活用", h:"既存の学校・許認可・顧客が効くか"},
    {k:"market",  n:"市場の伸び",     h:"規模と成長の見込み"},
    {k:"feasible",n:"実現のしやすさ", h:"人・時間・許認可のハードル"},
    {k:"profit",  n:"収益性",         h:"粗利と積み上がり方"},
    {k:"risk",    n:"リスク耐性",     h:"5 = リスクが低い"}
  ];
  var ST=["draft","adopt","hold","drop"];
  var ST_JA={draft:"検討中",adopt:"注力",hold:"保留",drop:"見送り"};
  var ST_LIGHT={draft:"#6C4DF6",adopt:"#FF4D6D",hold:"#FFB020",drop:"#C9C5D6"};
  var ST_DARK ={draft:"#9B7BFF",adopt:"#FF6B85",hold:"#FFC44D",drop:"#5B5474"};
  var C_LIGHT={paper2:"#FFFFFF",ink:"#1E1B2E",inkSoft:"#6F6A85",rule:"#E7E2F4",
               shu:"#FF4D6D",ai:"#6C4DF6",moegi:"#FFB020",mute:"#C9C5D6",shadow:"#2B1B5A",shadowOp:"0.16"};
  var C_DARK ={paper2:"#241F33",ink:"#F2EFFA",inkSoft:"#A9A2C0",rule:"#3A3350",
               shu:"#FF6B85",ai:"#9B7BFF",moegi:"#FFC44D",mute:"#5B5474",shadow:"#000000",shadowOp:"0.55"};
  var ST_COLOR=ST_LIGHT, C=C_LIGHT, dark=false;
  var HUES=[
    {base:"#6C4DF6",tint:"#EDE8FF",text:"#3C2AA6",dtint:"#2C2456",dtext:"#CBBBFF"},
    {base:"#FF4D6D",tint:"#FFE6EC",text:"#B01F41",dtint:"#4A2233",dtext:"#FFC2CE"},
    {base:"#12C2A0",tint:"#DDF6F0",text:"#0A7360",dtint:"#123F3A",dtext:"#8FEBD9"},
    {base:"#FF8A3D",tint:"#FFEEDF",text:"#B15318",dtint:"#4A2E1C",dtext:"#FFC79B"},
    {base:"#3BA6FF",tint:"#E2F0FF",text:"#15629E",dtint:"#173347",dtext:"#A9D7FF"},
    {base:"#E45CD8",tint:"#FBE6F9",text:"#94288C",dtint:"#42214A",dtext:"#F5B7EE"},
    {base:"#F0B400",tint:"#FFF4D4",text:"#8F6800",dtint:"#40350F",dtext:"#FFDD84"},
    {base:"#7BC043",tint:"#EDF7DF",text:"#4A7A1F",dtint:"#26361A",dtext:"#C4E89A"}
  ];
  function setTheme(on){
    dark=!!on; ST_COLOR=dark?ST_DARK:ST_LIGHT; C=dark?C_DARK:C_LIGHT;
    document.body.classList.toggle("dark",dark);
    var b=document.getElementById("z-dark"); if(b) b.textContent=dark?"☀":"☾";
  }
  function branchHue(n){
    var c=n, guard=0;
    while(c&&c.parent&&c.parent!=="root"&&guard++<12) c=byId(c.parent);
    if(!c||!c.parent) return HUES[0];
    var top=kids("root"), i=0;
    for(var j=0;j<top.length;j++) if(top[j].id===c.id) i=j;
    return HUES[i%HUES.length];
  }
  var SHAPES=["round","rect","pill","ellipse","hex"];
  var MINCHO='"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif';
  var GOTHIC='"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif';
  var FONTS=[
    {k:"mincho", n:"明朝",     css:MINCHO},
    {k:"gothic", n:"ゴシック", css:GOTHIC},
    {k:"maru",   n:"丸ゴシック",css:'"Hiragino Maru Gothic ProN","Zen Maru Gothic","Rounded Mplus 1c","M PLUS Rounded 1c",'+GOTHIC},
    {k:"mono",   n:"等幅",     css:'ui-monospace,"SF Mono","Osaka-Mono",Menlo,monospace'}
  ];
  function fontCss(k){ for(var i=0;i<FONTS.length;i++) if(FONTS[i].k===k) return FONTS[i].css; return null; }
  var KINDS=[
    {k:"curve",   n:"S字"},
    {k:"arc",     n:"弧"},
    {k:"straight",n:"直線"},
    {k:"elbow",   n:"直角"},
    {k:"step",    n:"階段"},
    {k:"taper",   n:"筆"}
  ];
  var DASHES=[{k:"solid",n:"実線",d:""},{k:"dash",n:"破線",d:"7 5"},{k:"dot",n:"点線",d:"1.5 4"}];
  var FILLS=["#FFFFFF","#EDE8FF","#FFE6EC","#DDF6F0","#FFEEDF","#E2F0FF","#FBE6F9","#FFF4D4",
             "#6C4DF6","#FF4D6D","#12C2A0","#FF8A3D","#3BA6FF","#E45CD8","#1E1B2E"];
  var LINES=["#1E1B2E","#6F6A85","#E7E2F4","#6C4DF6","#FF4D6D","#12C2A0","#FF8A3D","#3BA6FF","#E45CD8","transparent"];
  var TEXTS=["#1E1B2E","#6F6A85","#FFFFFF","#3C2AA6","#B01F41","#0A7360","#B15318","#15629E","#94288C"];

  var SEED=[
    ["監理・支援（コア）",["建設分野の受入拡大","育成就労への移行対応","リネンサプライ分野","登録支援機関の受託拡大","監理支援機関ライセンス"]],
    ["送り出し・教育",["直営LPKの増設","日本語教育のオンライン化","パキスタン人材の開拓","特定技能試験の対策"]],
    ["SaaS・DX",["事業推進支援システム外販","ジョウケンくん単体提供","IT導入補助金への登録","AI監査支援"]],
    ["士業・コンサル",["行政書士法人との連携","監理団体サポート拡張","許可取消リスク診断"]],
    ["生活サービス",["住居・寮の手配","送金・通信・保険の取次","通訳・翻訳"]],
    ["情報発信",["note / X での発信","実務者向け勉強会","コミュニティ運営"]]
  ];

  var NS="http://www.w3.org/2000/svg";
  var state=null, sel=null, view="map", fsOn=false;
  var cam={x:0,y:0,k:1};
  var svg=document.getElementById("svg"), stage=document.getElementById("stage"), gRoot=null;

  function uid(){ return "n"+Math.random().toString(36).slice(2,9); }
  function blank(){ var s={}; AXES.forEach(function(a){s[a.k]=3;}); return s; }
  function mk(parent,label){
    return {id:uid(),parent:parent,label:label,note:"",scores:blank(),rated:false,status:"draft",
      x:null,y:null,w:null,h:null,fs:null,shape:null,bg:null,border:null,color:null,font:null,bold:null,
      lk:null,lc:null,lw:null,ld:null,la:null};
  }
  function buildSeed(){
    var r=mk(null,"ARC / グローバルアルファ"); r.id="root"; r.x=0; r.y=0; r.shape="pill";
    var out=[r];
    SEED.forEach(function(d){ var p=mk("root",d[0]); out.push(p);
      d[1].forEach(function(c){ out.push(mk(p.id,c)); }); });
    return out;
  }

  /* ---------- model ---------- */
  function byId(id){ for(var i=0;i<state.nodes.length;i++) if(state.nodes[i].id===id) return state.nodes[i]; return null; }
  function kids(id){ return state.nodes.filter(function(n){ return n.parent===id; }); }
  function root(){ return byId("root")||state.nodes[0]; }
  function depth(n){ var d=0,c=n; while(c&&c.parent){ c=byId(c.parent); d++; if(d>12) break; } return d; }
  function scorable(n){ return depth(n)>=2; }
  function cands(){ return state.nodes.filter(scorable); }
  function subtree(id){ var out=[],st=[id]; while(st.length){ var i=st.pop(); out.push(i); kids(i).forEach(function(c){ st.push(c.id); }); } return out; }
  function score(n){ var w=state.weights,num=0,den=0;
    AXES.forEach(function(a){ var t=(typeof w[a.k]==="number")?w[a.k]:1; num+=t*n.scores[a.k]; den+=t*5; });
    return den?Math.round(num/den*100):0; }
  function attract(n){ return (n.scores.market+n.scores.profit+n.scores.synergy)/3; }
  function doable(n){ return (n.scores.feasible+n.scores.risk)/2; }

  /* ---------- storage / documents ---------- */
  var IDX="jigyo:index", DOCP="jigyo:doc:", CUR="jigyo:current", THK="jigyo:theme";
  var docId=null, docs=[], offline=false;
  function setSave(t){ var e=document.getElementById("save"); if(e) e.textContent=" "+t; }
  function get(k){ try{ return window.storage.get(k); }catch(e){ return Promise.reject(e); } }
  function put(k,v){ try{ return window.storage.set(k,v); }catch(e){ return Promise.reject(e); } }
  function del(k){ try{ return window.storage.delete(k); }catch(e){ return Promise.reject(e); } }
  function nowIso(){ return new Date().toISOString(); }
  function fmt(iso){
    var d=new Date(iso); if(isNaN(d.getTime())) return "";
    return d.getFullYear()+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+("0"+d.getDate()).slice(-2)+" "+
      ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
  }
  function newId(){ return "d"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function fresh(name){
    return {name:name||"新しいマップ",
      weights:{synergy:2,market:1.5,feasible:1.5,profit:1.5,risk:1},nodes:buildSeed()};
  }
  function emptyMap(name){
    var r=mk(null,name||"中心"); r.id="root"; r.x=0; r.y=0; r.shape="pill";
    return {name:name||"新しいマップ",
      weights:{synergy:2,market:1.5,feasible:1.5,profit:1.5,risk:1},nodes:[r]};
  }
  function entry(id){ for(var i=0;i<docs.length;i++) if(docs[i].id===id) return docs[i]; return null; }
  function saveIndex(){ return put(IDX,JSON.stringify(docs)).catch(function(){}); }

  function save(){
    clearTimeout(save._t);
    save._t=setTimeout(function(){
      if(offline||!docId){ setSave("この画面のみ保持"); return; }
      var e=entry(docId), t=nowIso();
      if(e){ e.name=state.name||e.name; e.updated=t; }
      put(DOCP+docId,JSON.stringify(state)).then(function(){
        setSave("保存済み "+fmt(t)); saveIndex(); paintDocName();
      },function(){ setSave("この画面のみ保持"); });
    },350);
  }
  function saveNow(){ clearTimeout(save._t); save._t=null;
    if(offline||!docId) return Promise.resolve();
    var e=entry(docId), t=nowIso(); if(e){ e.name=state.name||e.name; e.updated=t; }
    return put(DOCP+docId,JSON.stringify(state)).then(saveIndex).catch(function(){});
  }

  function ready(msg){
    migrate(); tidy(true); boot(); paintDocName(); paintDocs();
    if(msg) setSave(msg);
  }
  function createDoc(st,quiet){
    return saveNow().then(function(){ return createDocNow(st,quiet); });
  }
  function createDocNow(st,quiet){
    var id=newId(); if(!st.name) st.name="新しいマップ";
    docs.unshift({id:id,name:st.name,updated:nowIso()});
    docId=id; state=st;
    return put(DOCP+id,JSON.stringify(st)).then(saveIndex).then(function(){ return put(CUR,id); })
      .then(function(){ ready("保存済み"); },function(){ offline=true; ready("保存なしで動作中"); })
      .then(function(){ if(!quiet) toast("新しいマップを作りました"); });
  }
  function openDoc(id){
    return saveNow().then(function(){ return get(DOCP+id); }).then(function(r){
      state=r&&r.value?JSON.parse(r.value):fresh();
      docId=id; sel=null; put(CUR,id); ready("読み込み済み");
    }).catch(function(){ toast("開けませんでした"); });
  }
  function legacy(){
    var tryKey=function(k,conv){ return get(k).then(function(r){
      if(r&&r.value){ var v=JSON.parse(r.value); return conv?conv(v):v; } throw 0; }); };
    return tryKey("jigyo-map:v3")
      .catch(function(){ return tryKey("jigyo-map:v2"); })
      .catch(function(){ return tryKey("jigyo-map:v1",conv1); })
      .catch(function(){ return null; })
      .then(function(st){ return createDoc(st||fresh("事業候補マップ"),true); });
  }
  function load(){
    get(THK).then(function(r){ setTheme(r&&r.value==="dark"); }).catch(function(){
      if(window.matchMedia) setTheme(window.matchMedia("(prefers-color-scheme: dark)").matches);
    });
    get(IDX).then(function(r){
      docs=r&&r.value?JSON.parse(r.value):[];
      if(!docs.length) return legacy();
      return get(CUR).then(function(c){
        var id=(c&&c.value&&entry(c.value))?c.value:docs[0].id;
        return openDoc(id);
      }).catch(function(){ return openDoc(docs[0].id); });
    }).catch(function(){
      offline=true; docId="local"; state=fresh("事業候補マップ"); ready("保存なしで動作中");
    });
  }
  function conv1(v1){
    var ns=(v1.nodes||[]).slice();
    ns.forEach(function(n){ if(!n.parent) n.parent="root"; n.x=null; n.y=null; });
    var r=mk(null,"ARC / グローバルアルファ"); r.id="root"; r.x=0; r.y=0; r.shape="pill";
    ns.unshift(r);
    return {weights:v1.weights||{synergy:2,market:1.5,feasible:1.5,profit:1.5,risk:1},nodes:ns};
  }
  function migrate(){
    if(!state.name) state.name="事業候補マップ";
    if(!state.weights) state.weights={synergy:2,market:1.5,feasible:1.5,profit:1.5,risk:1};
    if(!state.nodes||!state.nodes.length) state.nodes=buildSeed();
    if(!byId("root")){
      state.nodes.forEach(function(n){ if(!n.parent) n.parent="root"; });
      var r=mk(null,"中心"); r.id="root"; r.x=0; r.y=0; r.shape="pill"; state.nodes.unshift(r);
    }
    state.nodes.forEach(function(n){
      if(!n.scores) n.scores=blank();
      AXES.forEach(function(a){ if(typeof n.scores[a.k]!=="number") n.scores[a.k]=3; });
      if(!n.status) n.status="draft";
      if(typeof n.note!=="string") n.note="";
      ["w","h","fs","shape","bg","border","color","font","bold","lk","lc","lw","ld","la"].forEach(function(k){ if(n[k]===undefined) n[k]=null; });
    });
  }

  /* ---------- layout ---------- */
  var RAD=[0,265,180,145,125];
  function leafCount(n){ var k=kids(n.id); if(!k.length) return 1; var s=0; k.forEach(function(c){ s+=leafCount(c); }); return s; }
  function place(n,a0,a1,d){
    var k=kids(n.id); if(!k.length) return;
    var tot=0; k.forEach(function(c){ tot+=leafCount(c); });
    var a=a0, r=RAD[Math.min(d,RAD.length-1)];
    k.forEach(function(c){
      var span=(a1-a0)*leafCount(c)/tot, mid=a+span/2;
      c.x=(d===1?0:n.x)+Math.cos(mid)*r; c.y=(d===1?0:n.y)+Math.sin(mid)*r;
      place(c,a+span*0.08,a+span*0.92,d+1); a+=span;
    });
  }
  function tidy(onlyMissing){
    var r=root(); r.x=0; r.y=0;
    if(onlyMissing && !state.nodes.some(function(n){ return typeof n.x!=="number"; })) return;
    place(r,-Math.PI/2,-Math.PI/2+Math.PI*2,1);
  }

  /* ---------- geometry ---------- */
  function defFs(d){ return d===0?15:(d===1?13.5:12); }
  function wrapTo(txt,per){
    var out=[],cur="";
    per=Math.max(2,per);
    for(var i=0;i<txt.length;i++){ cur+=txt[i]; if(cur.length>=per){ out.push(cur); cur=""; } }
    if(cur) out.push(cur);
    return out.length?out:[""];
  }
  function box(n){
    var d=depth(n), fs=n.fs||defFs(d), label=n.label||"（無題）";
    if(n.w&&n.h){
      var per=Math.floor((n.w-20)/fs);
      var maxLines=Math.max(1,Math.floor((n.h-10)/(fs+5)));
      var ls=wrapTo(label,per).slice(0,maxLines);
      return {w:n.w,h:n.h,fs:fs,lines:ls,d:d};
    }
    var per2=d===0?9:(d===1?8:9);
    var lines=wrapTo(label,per2).slice(0,3);
    var maxL=0; lines.forEach(function(l){ if(l.length>maxL) maxL=l.length; });
    return {w:Math.max(64,maxL*fs+30),h:lines.length*(fs+5)+22,fs:fs,lines:lines,d:d};
  }
  function styleOf(n,b){
    var d=b.d, hue=branchHue(n);
    return {
      hue:hue,
      shape:n.shape||(d===0?"pill":"round"),
      bg:n.bg||(d===0?"url(#gRoot)":(d===1?hue.base:(dark?hue.dtint:hue.tint))),
      border:n.border||(n.status==="adopt"?C.shu:(n.status==="hold"?hue.base:"none")),
      color:n.color||(d<=1?"#FFFFFF":(dark?hue.dtext:hue.text)),
      font:fontCss(n.font)||(d<=1?GOTHIC:GOTHIC),
      weight:n.bold?"700":(d<=1?"700":"600")
    };
  }

  /* ---------- draw ---------- */
  function el(t,a,txt){ var x=document.createElementNS(NS,t); for(var k in a) x.setAttribute(k,a[k]); if(txt!=null) x.textContent=txt; return x; }
  function shapeNode(shape,b,attrs){
    if(shape==="ellipse") { attrs.cx=0; attrs.cy=0; attrs.rx=b.w/2; attrs.ry=b.h/2; return el("ellipse",attrs); }
    if(shape==="hex"){

        .map(function(p){return p[0]+","+p[1];}).join(" ");
      return el("polygon",attrs);
    }
    attrs.x=-b.w/2; attrs.y=-b.h/2; attrs.width=b.w; attrs.height=b.h;
    attrs.rx = shape==="rect"?0:(shape==="pill"?b.h/2:Math.min(15,b.h/2.4));
    return el("rect",attrs);
  }

  function edgeStyleOf(n){
    var hue=branchHue(n), d=depth(n);
    return {
      kind:n.lk||"taper",
      color:n.lc||(n.status==="adopt"?C.shu:hue.base),
      width:(typeof n.lw==="number"&&n.lw>0)?n.lw:(d===1?2.6:1.7),
      dash:(function(){ for(var i=0;i<DASHES.length;i++) if(DASHES[i].k===n.ld) return DASHES[i].d; return ""; })(),
      arrow:!!n.la

  }
  function edgePath(p,n,kind){
    var x1=p.x,y1=p.y,x2=n.x,y2=n.y,dx=x2-x1,dy=y2-y1;
    if(kind==="straight") return "M"+x1+","+y1+" L"+x2+","+y2;
    if(kind==="elbow")    return "M"+x1+","+y1+" L"+x2+","+y1+" L"+x2+","+y2;
    if(kind==="step"){ var mx=x1+dx/2; return "M"+x1+","+y1+" L"+mx+","+y1+" L"+mx+","+y2+" L"+x2+","+y2; }
    if(kind==="arc"){
      var r=Math.max(1,Math.hypot(dx,dy)*0.92);
      return "M"+x1+","+y1+" A"+r+","+r+" 0 0,"+(dx>=0?1:0)+" "+x2+","+y2;
    }
    return "M"+x1+","+y1+" C"+(x1+dx*0.45)+","+y1+" "+(x2-dx*0.45)+","+y2+" "+x2+","+y2;
  }
  function taperPath(p,n,w){
    var x1=p.x,y1=p.y,x2=n.x,y2=n.y,dx=x2-x1;
    var c1=x1+dx*0.45, c2=x2-dx*0.45;
    var hw=Math.max(2.5,w*3.2), tw=Math.max(0.5,w*0.45);
    return "M"+x1+","+(y1-hw)+" C"+c1+","+(y1-hw)+" "+c2+","+(y2-tw)+" "+x2+","+(y2-tw)+

  }
  function endTangent(p,n,kind){
    var dx=n.x-p.x, dy=n.y-p.y, L;

    if(kind==="straight"||kind==="arc"){ L=Math.hypot(dx,dy)||1; return {x:dx/L,y:dy/L}; }

  function arrowFor(p,n,kind,b,size,color){
    var u=endTangent(p,n,kind);
    var tx=Math.abs(u.x)>1e-6 ? (b.w/2+2)/Math.abs(u.x) : 1e9;
    var ty=Math.abs(u.y)>1e-6 ? (b.h/2+2)/Math.abs(u.y) : 1e9;
    var t=Math.min(tx,ty);
    var ax=n.x-u.x*t, ay=n.y-u.y*t, a=Math.atan2(u.y,u.x), s=size;

      [ax-Math.cos(a-0.42)*s, ay-Math.sin(a-0.42)*s],
      [ax-Math.cos(a+0.42)*s, ay-Math.sin(a+0.42)*s]];
    return el("polygon",{points:pts.map(function(q){return q[0]+","+q[1];}).join(" "),fill:color});
  }

  function draw(){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    gRoot=el("g",{}); svg.appendChild(gRoot); applyCam();
    var defs=el("defs",{});
    defs.innerHTML=
      '<linearGradient id="gRoot" x1="0" y1="0" x2="1" y2="1">'+
      '<stop offset="0" stop-color="#7C5CFF"/><stop offset="0.55" stop-color="#B45CFF"/>'+
      '<stop offset="1" stop-color="#FF5C9E"/></linearGradient>'+
      '<filter id="nsh" x="-40%" y="-40%" width="180%" height="180%">'+
      '<feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="'+C.shadow+'" flood-opacity="'+C.shadowOp+'"/></filter>'+
      '<filter id="nshBig" x="-50%" y="-50%" width="200%" height="200%">'+
      '<feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="'+(dark?"#000000":"#5B2BA8")+'" flood-opacity="'+(dark?"0.6":"0.30")+'"/></filter>';
    svg.insertBefore(defs,gRoot);
    var edges=el("g",{}), nodes=el("g",{});
    gRoot.appendChild(edges); gRoot.appendChild(nodes);

    state.nodes.forEach(function(n){
      if(!n.parent) return;
      var p=byId(n.parent); if(!p) return;
      var es=edgeStyleOf(n), op=(n.status==="drop"?.35:.9);

      } else {
        edges.appendChild(el("path",{d:edgePath(p,n,es.kind),fill:"none",stroke:es.color,
          "stroke-width":es.width,"stroke-dasharray":es.dash,"stroke-linecap":"round",
          "stroke-linejoin":"round",opacity:op}));

      if(es.arrow){
        var ar=arrowFor(p,n,es.kind,box(n),Math.max(6,es.width*3.4),es.color);

      }
    });

    state.nodes.forEach(function(n){
      var b=box(n), s=styleOf(n,b), isSel=(sel===n.id);
      var g=el("g",{transform:"translate("+n.x+","+n.y+")","data-id":n.id}); g.style.cursor="pointer";
      if(isSel){
        var halo=shapeNode(s.shape,{w:b.w+11,h:b.h+11},{fill:"none",stroke:C.ai,"stroke-width":2.5,opacity:".95"});
        var halo2=shapeNode(s.shape,{w:b.w+19,h:b.h+19},{fill:C.ai,opacity:".13",stroke:"none"});
        g.appendChild(halo2); g.appendChild(halo);
      }
      var shp=shapeNode(s.shape,b,{
        fill:s.bg, stroke:(s.border==="none"?"none":s.border),
        "stroke-width":s.border==="none"?0:(n.status==="adopt"?2.2:1.6),
        "stroke-dasharray":n.status==="hold"?"6 4":"",
        opacity:n.status==="drop"?".42":1

      shp.setAttribute("filter", b.d===0?"url(#nshBig)":"url(#nsh)");
      g.appendChild(shp);
      var y0=-((b.lines.length-1)*(b.fs+5))/2+b.fs*0.35;
      b.lines.forEach(function(line,i){
        var t=el("text",{x:0,y:y0+i*(b.fs+5),"text-anchor":"middle","font-size":b.fs,
          "font-family":s.font,"font-weight":s.weight,"letter-spacing":"0.01em",fill:s.color,
          opacity:n.status==="drop"?".5":1},line);
        if(n.status==="drop") t.setAttribute("text-decoration","line-through");
        g.appendChild(t);
      });
      if(n.rated&&b.d>=2){
        var sc=score(n), bw=sc>=100?30:26;
        g.appendChild(el("rect",{x:b.w/2-bw+6,y:-b.h/2-9,width:bw,height:19,rx:9.5,
          fill:ST_COLOR[n.status],filter:"url(#nsh)"}));
        g.appendChild(el("text",{x:b.w/2-bw/2+6,y:-b.h/2+4.5,"text-anchor":"middle","font-size":"11",
          "font-family":'ui-monospace,Menlo,monospace',"font-weight":"700",fill:"#fff"},sc));
      }
      if(isSel){
        var hs=13/cam.k;
        var h=el("rect",{x:b.w/2-hs/2,y:b.h/2-hs/2,width:hs,height:hs,rx:hs*0.3,fill:C.ai,stroke:"#fff",

  function paintHint(){
    var e=document.getElementById("hint"); if(!e||!state) return;
    if(state.nodes.length<=1){ e.textContent="中心をタップ →「＋ 子を足す」で枝を伸ばします"; return; }
    e.textContent = fsOn ? "ドラッグで移動　右下の■で大きさ　ダブルタップで改名"
                         : "タップで選択　ドラッグで移動　ダブルタップで改名";

  function applyCam(){ if(gRoot) gRoot.setAttribute("transform","translate("+cam.x+","+cam.y+") scale("+cam.k+")"); }
  function bounds(){
    var x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
    state.nodes.forEach(function(n){ var b=box(n);
      x1=Math.min(x1,n.x-b.w/2); x2=Math.max(x2,n.x+b.w/2);
      y1=Math.min(y1,n.y-b.h/2); y2=Math.max(y2,n.y+b.h/2); });

  }

    var r=svg.getBoundingClientRect(); if(!r.width) return;
    var b=bounds(), pad=28;
    var k=Math.min((r.width-pad*2)/Math.max(1,b.x2-b.x1),(r.height-pad*2)/Math.max(1,b.y2-b.y1));
    cam.k=Math.max(.15,Math.min(1.6,k));
    cam.x=r.width/2-((b.x1+b.x2)/2)*cam.k; cam.y=r.height/2-((b.y1+b.y2)/2)*cam.k;

  /* ---------- pointer ---------- */
  var pts={}, drag=null, pan=null, rsz=null, pinch=null, tapT=0, tapId=null;
  function toLocal(e){ var r=svg.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
  function attrUp(e,name){ var t=e.target; while(t&&t!==svg){ if(t.getAttribute&&t.getAttribute(name)) return t.getAttribute(name); t=t.parentNode; } return null; }

  svg.addEventListener("pointerdown",function(e){
    svg.setPointerCapture(e.pointerId); pts[e.pointerId]=toLocal(e);
    var ids=Object.keys(pts);
    if(ids.length===2){ drag=null; pan=null; rsz=null;
      var a=pts[ids[0]],b=pts[ids[1]];
      pinch={d:Math.hypot(a.x-b.x,a.y-b.y),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2}; return; }
    var p=toLocal(e);
    var rid=attrUp(e,"data-resize");
    if(rid){ var rn=byId(rid), rb=box(rn);
      rsz={id:rid,sx:p.x,sy:p.y,ow:rb.w,oh:rb.h,ox:rn.x,oy:rn.y}; return; }
    var id=attrUp(e,"data-id");
    if(id){ var n=byId(id); drag={id:id,sx:p.x,sy:p.y,ox:n.x,oy:n.y,moved:false}; }
    else { pan={sx:p.x,sy:p.y,cx:cam.x,cy:cam.y,moved:false}; svg.classList.add("grabbing"); }
  });

  svg.addEventListener("pointermove",function(e){
    if(!(e.pointerId in pts)) return;
    pts[e.pointerId]=toLocal(e);
    var ids=Object.keys(pts);
    if(pinch&&ids.length>=2){
      var a=pts[ids[0]],b=pts[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(pinch.d>0) zoomAt(d/pinch.d,pinch.cx,pinch.cy);
      pinch.d=d; return;
    }
    var p=toLocal(e);
    if(rsz){
      var n=byId(rsz.id);
      var nw=Math.max(56,rsz.ow+(p.x-rsz.sx)/cam.k), nh=Math.max(30,rsz.oh+(p.y-rsz.sy)/cam.k);
      n.w=Math.round(nw); n.h=Math.round(nh);
      n.x=rsz.ox+(n.w-rsz.ow)/2; n.y=rsz.oy+(n.h-rsz.oh)/2;

    } else if(drag){
      var dx=p.x-drag.sx, dy=p.y-drag.sy;
      if(Math.abs(dx)>4||Math.abs(dy)>4) drag.moved=true;
      if(drag.moved){ var m=byId(drag.id); m.x=drag.ox+dx/cam.k; m.y=drag.oy+dy/cam.k; draw(); }
    } else if(pan){
      var ddx=p.x-pan.sx, ddy=p.y-pan.sy;
      if(Math.abs(ddx)>4||Math.abs(ddy)>4) pan.moved=true;

  });

  function endPointer(e){
    delete pts[e.pointerId];

    if(drag){

        var now=Date.now();

  /* ---------- selection & rename ---------- */

  function mapSvg(){
    var prev=sel, wasDark=dark;
    if(wasDark) setTheme(false);
    sel=null; draw();
    var b=bounds(), pad=44;
    var w=Math.round(b.x2-b.x1+pad*2), h=Math.round(b.y2-b.y1+pad*2);
    var x0=Math.round(b.x1-pad), y0=Math.round(b.y1-pad);
    var ser=new XMLSerializer(), inner="";
    for(var i=0;i<gRoot.childNodes.length;i++) inner+=ser.serializeToString(gRoot.childNodes[i]);
    sel=prev; if(wasDark) setTheme(true); draw();
    return {w:w,h:h,
      svg:'<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="'+x0+' '+y0+' '+w+' '+h+'">'+
          '<rect x="'+x0+'" y="'+y0+'" width="'+w+'" height="'+h+'" fill="#FFFFFF"/>'+inner+'</svg>'};
  }

  function md(){
    var out=["# 事業候補マップ",""];
    out.push("重み： "+AXES.map(function(a){return a.n+" ×"+state.weights[a.k];}).join(" / "),"");
    (function walk(n,lv){
      kids(n.id).forEach(function(c){
        var pre = lv<=1 ? "\n## "+c.label : new Array((lv-2)*2+1).join(" ")+"- **"+c.label+"**";
        out.push(pre + (scorable(c) ? " — "+(c.rated?score(c)+"点":"未評価")+" ／ "+ST_JA[c.status] : ""));
        if(c.note) out.push("  > "+c.note.replace(/\n/g," "));
        walk(c,lv+1);
      });
    })(root(),1);
    var r=cands().filter(function(n){return n.rated;}).sort(function(a,b){return score(b)-score(a);});
    if(r.length){ out.push("","## 優先順位");
      r.forEach(function(n,i){ out.push((i+1)+". "+n.label+" — "+score(n)+"点 ／ "+ST_JA[n.status]); }); }
    return out.join("\n");
  }
  function dl(name,text,type){
    var b=new Blob([text],{type:type||"text/plain;charset=utf-8"}), u=URL.createObjectURL(b);
    var a=document.createElement("a"); a.href=u; a.download=name; a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); },500);
  }
  document.getElementById("ex-md").onclick=function(){
    var t=md();
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(t).then(function(){toast("コピーしました");},function(){dl("jigyo-map.md",t);toast("ファイルにしました");});
    else { dl("jigyo-map.md",t); toast("ファイルにしました"); }
  };
  document.getElementById("ex-json").onclick=function(){ dl(((state.name||"jigyo-map").replace(/[\\/:*?"<>|]/g,"_"))+".json",JSON.stringify(state,null,2),"application/json"); };
  function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.classList.add("on");
    clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove("on"); },1500); }

  /* ---------- views ---------- */
  document.querySelectorAll(".views button").forEach(function(b){
    b.onclick=function(){
      view=b.dataset.view;
      document.querySelectorAll(".views button").forEach(function(x){ x.setAttribute("aria-selected",x===b?"true":"false"); });
      ["map","rank","mx"].forEach(function(v){ document.getElementById("view-"+v).hidden=(v!==view); });
      if(view!=="map"){ bar.classList.remove("on"); hideInline(); }
      else if(sel) bar.classList.add("on");
    };
  });
  window.addEventListener("resize",function(){ if(view==="map") positionInline(); });
  document.getElementById("z-dark").onclick=function(){
    setTheme(!dark); put(THK,dark?"dark":"light"); draw(); renderAll();
    toast(dark?"ダークモード":"ライトモード");
  };
  function boot(){ draw(); fit(); renderAll(); }
  load();
})();
</script>
